[platformio]
src_dir = .
include_dir = Core/Inc
default_envs = stm32f107vc_jlink

[env]
platform = ststm32@19.6.0
board = eval_f107vc
board_build.ldscript = STM32F107VC_FLASH.ld
build_src_filter = -<*> +<Core/Src/*.c> +<Core/Startup/*.s> +<Drivers/STM32F1xx_HAL_Driver/Src/*.c> +<Application/Src/*.c> +<Libraries/*/Src/*.c>
build_flags =
    -D USE_HAL_DRIVER
    -D STM32F107xC
    -nostartfiles
    --specs=nano.specs
    --specs=nosys.specs
    -I Drivers/STM32F1xx_HAL_Driver/Inc
    -I Drivers/STM32F1xx_HAL_Driver/Inc/Legacy
    -I Drivers/CMSIS/Include
    -I Drivers/CMSIS/Device/ST/STM32F1xx/Include
    -Wall
    -Wextra
    -Werror
    -Wno-unused-parameter
    -I Application/Inc
    -I Libraries/OneWire/Inc
    -I Libraries/DS18B20/Inc

[env:stm32f107vc_jlink]
upload_protocol = jlink
debug_tool = jlink

[env:stm32f107vc_stlink]
upload_protocol = stlink
debug_tool = stlink
